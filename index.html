<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo Torajo - Mural de Investigação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0b0914;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #debugBanner {
            position: fixed;
            top: 15px;
            left: 20px;
            background: #ffb703;
            color: #000;
            padding: 8px 16px;
            border: 3px solid #000;
            border-radius: 8px;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 #000;
            z-index: 1000;
            display: none;
            pointer-events: none;
        }

        /* --- PALCO PRINCIPAL (DESKTOP PADRÃO) --- */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .mural-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 95vh;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mural-img-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .mapa-hover-highlight {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            cursor: pointer;
            opacity: 0; 
            transition: opacity 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 16px rgba(230, 57, 70, 0.7));
            z-index: 5;
        }

        .mapa-hover-highlight:hover {
            opacity: 0.65;
            filter: drop-shadow(0 0 20px rgba(230, 57, 70, 0.85)) brightness(1.05);
        }

        /* --- POPUPS / OVERLAYS --- */
        .overlay-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .overlay-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 25px;
            background: #e63946;
            color: #fff;
            border: 3.5px solid #000;
            border-radius: 50%;
            width: 52px; height: 52px;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- MAPA EXPANDIDO --- */
        .mapa-modal-container {
            position: relative;
            width: 96vw;
            max-width: 1300px;
            max-height: 90vh;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mapa-modal-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .pin-point {
            position: absolute;
            width: 44px;
            height: 44px;
            border: 3.5px solid #000;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            z-index: 10;
        }

        .pin-point.unlocked {
            background-color: #e63946;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 4px 0 #000;
            animation: pulsePin 2s infinite;
        }

        .pin-point.unlocked:hover {
            transform: translate(-50%, -50%) scale(1.3);
            background-color: #ffb703;
            animation: none;
        }

        .pin-point.locked {
            background-color: #555;
            border-color: #222;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #000;
            opacity: 0.85;
        }

        .pin-label {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: nowrap;
            pointer-events: none;
            border: 1.5px solid #333;
        }

        @keyframes pulsePin {
            0%, 100% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 0 4px 0 #000; }
            50% { box-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 4px 0 #000; }
        }

        /* --- TELA DA CHARADA --- */
        .charada-modal-box {
            position: relative;
            width: 96vw;
            max-width: 1050px;
            max-height: 90vh;
            aspect-ratio: 16 / 9;
            background-image: url('Tela1_2.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        .charada-content-overlay {
            width: 62%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
        }

        .charada-titulo {
            color: #e63946;
            font-size: 1.1rem;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .rule-badge {
            background: #1d3557;
            color: #ffb703;
            border: 2.5px solid #000;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.74rem;
            font-weight: 900;
            margin-bottom: 10px;
            box-shadow: 0 2px 0 #000;
            line-height: 1.2;
        }

        /* --- CAIXAS DAS PISTAS --- */
        .boxes-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 8px;
        }

        .box-card {
            flex: 1;
            border: 3.5px solid #000;
            padding: 12px 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: transform 0.15s, filter 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 155px;
            position: relative;
            border-radius: 12px;
        }

        .box-azul { background: #3a86ff; color: #fff; }
        .box-vermelha { background: #e63946; color: #fff; }
        .box-verde { background: #2ecc71; color: #000; }

        .box-card:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .box-card.correct-box {
            background: #f1c40f !important;
            color: #000 !important;
            border-color: #000 !important;
            transform: scale(1.04);
        }

        .box-title {
            font-size: 0.85rem;
            border-bottom: 2px solid currentColor;
            width: 100%;
            padding-bottom: 4px;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .box-statement {
            font-size: 0.72rem;
            font-family: sans-serif;
            font-weight: bold;
            line-height: 1.35;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
        }

        .box-icon {
            font-size: 1.6rem;
            margin-top: 8px;
        }

        .reward-box {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #ffe3e3;
            border: 3.5px solid #e63946;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            box-shadow: 0 4px 0 #000;
            animation: popIn 0.3s ease-out;
            margin-top: 5px;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .reward-phrase {
            color: #1d3557;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-top: 4px;
            background: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            border: 2px solid #000;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .input-group input {
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            border: 3.5px solid #000;
            border-radius: 10px;
            outline: none;
            text-align: center;
            background: #fff;
        }

        .input-group button {
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.95rem;
            background: #2ecc71;
            color: #000;
            border: 3.5px solid #000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }

        .feedback-msg {
            margin-top: 4px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
            font-weight: bold;
        }
        .feedback-msg.sucesso { color: #27ae60; }
        .feedback-msg.erro { color: #c0392b; }

        /* =========================================================
           📱 REGRAS DE ADAPTAÇÃO PARA DISPOSITIVOS MÓVEIS (REAIS)
           ========================================================= */
        @media (max-width: 600px) and (orientation: portrait) {
            .mural-wrapper {
                aspect-ratio: 9 / 16;
            }

            .mapa-modal-container {
                width: 92vw;
                max-height: 92vh;
                aspect-ratio: 9 / 16;
            }

            .charada-modal-box {
                aspect-ratio: 9 / 16;
                max-height: 90vh;
            }

            .charada-content-overlay {
                width: 82%;
                max-width: none;
            }

            .boxes-container {
                flex-direction: column;
                gap: 8px;
            }

            .box-card {
                min-height: 95px;
                padding: 8px 6px;
            }

            .box-title {
                font-size: 0.75rem;
                margin-bottom: 4px;
            }

            .box-statement {
                font-size: 0.65rem;
                line-height: 1.2;
            }

            .box-icon {
                font-size: 1.2rem;
                margin-top: 2px;
            }

            .close-btn {
                top: 10px; right: 15px;
                width: 42px; height: 42px;
                font-size: 1.4rem;
            }

            .rule-badge {
                font-size: 0.65rem;
                padding: 4px 8px;
            }

            .reward-phrase {
                font-size: 0.95rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>

            {"statement1": "Esta é a caixa azul.", "statement2": "A caixa azul é verdadeira.", "statement3": "A caixa azul está vazia.", "correct": 1},
            {"statement1": "Esta é a única caixa verdadeira.", "statement2": "A maçã está na outra caixa com uma afirmação verdadeira.", "statement3": "Uma das outras caixas é verdadeira.", "correct": 3},
            {"statement1": "Esta declaração aparece em outra caixa.", "statement2": "A caixa azul está vazia.", "statement3": "Esta declaração aparece em outra caixa.", "correct": 1},
            {"statement1": "Duas dessas afirmações são verdadeiras.", "statement2": "A afirmação na caixa azul é verdadeira.", "statement3": "A maçã está em uma caixa com uma declaração verdadeira.", "correct": 3},
            {"statement1": "Você está investigando o caso.", "statement2": "Esta caixa está vazia.", "statement3": "A caixa azul é verdadeira.", "correct": 2}
        ];

        let diaAtualAberto = null;

        function adaptarLayoutTela() {
            // Considera mobile apenas se a tela for estreita E vertical
            const eMobileReal = (window.innerWidth <= 600) && (window.innerHeight > window.innerWidth);

            const bgImg = document.getElementById('muralBgImg');
            const overlayImg = document.getElementById('overlayImg');
            const modalMapaImg = document.getElementById('modalMapaImg');

            const pin31 = document.getElementById('pin31');
            const pin1 = document.getElementById('pin1');
            const pin2 = document.getElementById('pin2');

            if (eMobileReal) {
                bgImg.src = "TelaInicialMobile.png";
                overlayImg.src = "OverlayMobile.png";
                modalMapaImg.src = "OverlayMobile.png";

                pin31.style.top = "32%"; pin31.style.left = "30%";
                pin1.style.top = "48%";  pin1.style.left = "65%";
                pin2.style.top = "70%";  pin2.style.left = "38%";
            } else {
                bgImg.src = "TelaInicial.png";
                overlayImg.src = "Overlay.png";
                modalMapaImg.src = "Overlay.png";

                pin31.style.top = "36%"; pin31.style.left = "31%";
                pin1.style.top = "48%";  pin1.style.left = "51%";
                pin2.style.top = "74%";  pin2.style.left = "35%";
            }
        }

        function getHojeBR() {
            const agora = new Date();
            const brTime = new Date(agora.getTime() - (3 * 60 * 60 * 1000));
            return brTime.toISOString().split('T')[0];
        }

        function atualizarStatusPinos() {
            const hoje = getHojeBR();

            [31, 1, 2].forEach(dia => {
                const pinEl = document.getElementById(`pin${dia}`);
                const liberado = debugMode || (hoje >= CRONOGRAMA[dia].dataLiberacao);

                if (liberado) {
                    pinEl.className = "pin-point unlocked";
                    pinEl.innerHTML = `<span class="pin-label">DIA ${dia < 10 ? '0'+dia : dia}</span>`;
                } else {
                    pinEl.className = "pin-point locked";
                    pinEl.innerHTML = `🔒<span class="pin-label">DISPONÍVEL EM ${formataDataBR(CRONOGRAMA[dia].dataLiberacao)}</span>`;
                }
            });
        }

        function formataDataBR(dataIso) {
            const p = dataIso.split('-');
            return `${p[2]}/${p[1]}`;
        }

        function embaralharPuzzle() {
            if (puzzleConcluido31) return;

            const index = Math.floor(Math.random() * DB_PUZZLES.length);
            const puzzle = DB_PUZZLES[index];
            caixaCorretaMaca = puzzle.correct;

            document.getElementById('statement1').innerText = puzzle.statement1 ? `"${puzzle.statement1}"` : "[ Sem Inscrição ]";
            document.getElementById('statement2').innerText = puzzle.statement2 ? `"${puzzle.statement2}"` : "[ Sem Inscrição ]";
            document.getElementById('statement3').innerText = puzzle.statement3 ? `"${puzzle.statement3}"` : "[ Sem Inscrição ]";
            
            [1, 2, 3].forEach(i => {
                document.getElementById(`box${i}`).classList.remove('correct-box');
                document.getElementById(`icon${i}`).innerText = "📦";
            });
        }

        function abrirMapa() { 
            atualizarStatusPinos();
            document.getElementById('modalMapa').classList.add('active'); 
        }
        function fecharMapa() { 
            document.getElementById('modalMapa').classList.remove('active'); 
        }

        function escolherCaixa(numeroCaixa) {
            if (puzzleConcluido31) return;

            const feedback = document.getElementById('feedback');

            if (numeroCaixa === caixaCorretaMaca) {
                puzzleConcluido31 = true;

                document.getElementById(`box${numeroCaixa}`).classList.add('correct-box');
                document.getElementById(`icon${numeroCaixa}`).innerText = "🍎";

                feedback.className = "feedback-msg sucesso";
                feedback.innerText = "🎉 DEDUÇÃO PERFEITA! Você encontrou a maçã!";

                document.getElementById('rewardBox').style.display = "flex";
            } else {
                document.getElementById(`icon${numeroCaixa}`).innerText = "❌";
                feedback.className = "feedback-msg erro";
                feedback.innerText = "❌ A caixa está vazia! A dedução falhou.";
                
                setTimeout(() => {
                    embaralharPuzzle();
                    feedback.innerText = "🔄 Novo enigma gerado! Leia com atenção.";
                    feedback.className = "feedback-msg";
                }, 1200);
            }
        }

        function tentarAbrirCharada(dia) {
            const hoje = getHojeBR();
            const liberado = debugMode || (hoje >= CRONOGRAMA[dia].dataLiberacao);

            diaAtualAberto = dia;
            const feedback = document.getElementById('feedback');
            feedback.innerText = "";
            feedback.className = "feedback-msg";

            if (liberado) {
                const dados = CHARADAS[dia];
                document.getElementById('charadaTitulo').innerText = dados.titulo;

                if (dia === 31) {
                    document.getElementById('ruleBadge').style.display = "block";
                    document.getElementById('puzzleCaixas').style.display = "flex";
                    document.getElementById('areaResposta').style.display = "none";
                    if (!puzzleConcluido31) {
                        document.getElementById('rewardBox').style.display = "none";
                        embaralharPuzzle();
                    }
                } else {
                    document.getElementById('ruleBadge').style.display = "none";
                    document.getElementById('puzzleCaixas').style.display = "none";
                    document.getElementById('rewardBox').style.display = "none";
                    document.getElementById('areaResposta').style.display = "flex";
                    document.getElementById('inputResposta').value = "";
                }
            } else {
                document.getElementById('charadaTitulo').innerText = `🔒 PISTA BLOQUEADA`;
                document.getElementById('ruleBadge').style.display = "none";
                document.getElementById('puzzleCaixas').style.display = "none";
                document.getElementById('rewardBox').style.display = "none";
                document.getElementById('areaResposta').style.display = "none";
            }

            document.getElementById('modalCharada').classList.add('active');
        }

        function fecharCharada() { 
            document.getElementById('modalCharada').classList.remove('active'); 
        }

        function validarResposta() {
            const input = document.getElementById('inputResposta');
            const feedback = document.getElementById('feedback');
            const resposta = input.value.trim().toLowerCase();

            if (!resposta) {
                feedback.className = "feedback-msg erro";
                feedback.innerText = "Digite uma resposta antes de enviar!";
                return;
            }

            if (CHARADAS[diaAtualAberto].respostas.includes(resposta)) {
                feedback.className = "feedback-msg sucesso";
                feedback.innerText = "🎉 ACERTOU! Pista desvendada!";
            } else {
                feedback.className = "feedback-msg erro";
                feedback.innerText = "❌ Resposta incorreta... Pense mais um pouco!";
            }
        }

        document.getElementById('inputResposta').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validarResposta();
        });

        // DETECÇÃO DE DEBUG MODE
        let codigoDigitado = "";
        const PALAVRA_CHAVE = "debug";

        window.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;

            codigoDigitado += e.key.toLowerCase();
            if (codigoDigitado.length > PALAVRA_CHAVE.length) {
                codigoDigitado = codigoDigitado.slice(-PALAVRA_CHAVE.length);
            }

            if (codigoDigitado === PALAVRA_CHAVE) {
                debugMode = !debugMode;
                codigoDigitado = "";
                document.getElementById('debugBanner').style.display = debugMode ? 'block' : 'none';
                atualizarStatusPinos();
            }
        });

        window.addEventListener('resize', adaptarLayoutTela);
        adaptarLayoutTela();
        atualizarStatusPinos();
    </script>
</body>
</html>
